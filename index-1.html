<!DOCTYPE html>
<html lang="en">
<head>

<title>Remainder — Your life. Remembered.</title>
<meta name="description" content="Remainder is a private, local-first second brain for the people, memories, and responsibilities that matter." />
<meta name="theme-color" content="#2F6F62" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<!--

  manifest.json + a Service Worker as separate files. Since the requirement

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --radius-s:10px; --radius-m:16px; --radius-l:22px; --radius-xl:28px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: 64px;
}
:root[data-theme-resolved="light"]{
  --bg:#F7F7F3;
  --bg-elevated:#FDFDFB;
  --surface:#FFFFFF;
  --surface-2:#EFF0EA;
  --text:#20241F;
  --text-muted:#6C766D;
  --text-faint:#98A196;
  --border:#E6E6DF;
  --border-strong:#D5D6CC;
  --accent:#2F6F62;
  --accent-strong:#245349;
  --accent-soft:#E2EEE9;
  --danger:#B24A34;
  --danger-soft:#F6E4DE;
  --warning:#9A6B12;
  --warning-soft:#F5EAD4;
  --success:#2F6F62;
  --shadow-s: 0 1px 2px rgba(24,28,22,0.05);
  --shadow-m: 0 6px 20px rgba(24,28,22,0.08);
  --shadow-l: 0 16px 48px rgba(24,28,22,0.16);
  --scrim: rgba(20,22,18,0.42);
}
:root[data-theme-resolved="dark"]{
  --bg:#14181A;
  --bg-elevated:#181C1E;
  --surface:#1D2225;
  --surface-2:#242A2D;
  --text:#EEF1EE;
  --text-muted:#9AA6A0;
  --text-faint:#69746E;
  --border:#2A3134;
  --border-strong:#394245;
  --accent:#5FB79C;
  --accent-strong:#7ECBB2;
  --accent-soft:#1E2E29;
  --danger:#E2896E;
  --danger-soft:#33241F;
  --warning:#E4C067;
  --warning-soft:#332C1A;
  --success:#5FB79C;
  --shadow-s: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-m: 0 6px 20px rgba(0,0,0,0.35);
  --shadow-l: 0 20px 56px rgba(0,0,0,0.5);
  --scrim: rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  min-height:100vh; min-height:100dvh;
}
button, input, textarea, select{ font-family:inherit; color:inherit; }
h1,h2,h3,h4{ font-family:var(--font-display); margin:0; font-weight:600; letter-spacing:-0.01em; }
p{margin:0;}
a{color:inherit;}
::selection{ background:var(--accent-soft); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;
}

/* ============================= LAYOUT ============================= */
#app{ max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; position:relative; padding-bottom:calc(var(--nav-h) + 28px + var(--safe-bottom)); }

.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(18px + var(--safe-top)) 20px 10px;
}
.topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.topbar h1{ font-size:22px; }
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .15s ease, background .15s ease; color:var(--text);
}
.icon-btn:active{ transform:scale(0.94); }
.icon-btn svg{ width:19px; height:19px; }

main{ padding:4px 20px 8px; }

.section-title{
  font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-muted); margin:22px 2px 10px;
}
.section-title:first-child{ margin-top:4px; }

/* ============================= CARDS ============================= */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
  padding:16px; box-shadow:var(--shadow-s); margin-bottom:12px;
}
.card-tap{ cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
.card-tap:active{ transform:scale(0.985); }

.list-item{
  display:flex; align-items:flex-start; gap:12px; padding:13px 4px;
  border-bottom:1px solid var(--border); cursor:pointer;
}
.list-item:last-child{ border-bottom:none; }
.list-item:active{ background:var(--surface-2); border-radius:12px; }

.check-circle{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--border-strong);
  flex:0 0 auto; margin-top:1px; display:flex; align-items:center; justify-content:center;
  transition:all .15s ease; background:transparent;
}
.check-circle.done{ background:var(--accent); border-color:var(--accent); }
.check-circle svg{ width:12px; height:12px; opacity:0; transition:opacity .1s ease; }
.check-circle.done svg{ opacity:1; }

.item-title{ font-size:15px; font-weight:600; line-height:1.35; }
.item-sub{ font-size:13px; color:var(--text-muted); margin-top:3px; line-height:1.4; }
.item-meta{ font-size:12px; color:var(--text-faint); margin-top:4px; }

.row{ display:flex; align-items:center; gap:10px; }
.row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.spacer{ flex:1; }

/* badges */
.badge{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  padding:3px 8px; border-radius:20px; letter-spacing:.02em; white-space:nowrap;
}
.badge-critical{ background:var(--danger-soft); color:var(--danger); }
.badge-important{ background:var(--warning-soft); color:var(--warning); }
.badge-normal{ background:var(--surface-2); color:var(--text-muted); }
.badge-overdue{ background:var(--danger-soft); color:var(--danger); }
.badge-accent{ background:var(--accent-soft); color:var(--accent-strong); }
.badge-demo{ background:var(--warning-soft); color:var(--warning); }

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-size:14.5px; font-weight:600; padding:12px 18px; border-radius:var(--radius-s);
  border:1px solid transparent; cursor:pointer; transition:transform .12s ease, opacity .12s ease;
  min-height:44px;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{ background:var(--accent); color:#fff; }
.btn-secondary{ background:var(--surface); border-color:var(--border-strong); color:var(--text); }
.btn-ghost{ background:transparent; color:var(--text-muted); }
.btn-danger{ background:transparent; color:var(--danger); border-color:var(--danger-soft); }
.btn-block{ width:100%; }
.btn-sm{ padding:8px 14px; font-size:13px; min-height:36px; }

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:9px 15px; border-radius:20px;
  border:1px solid var(--border-strong); background:var(--surface); font-size:13.5px; font-weight:600;
  cursor:pointer; transition:all .12s ease; color:var(--text); min-height:40px;
}
.chip.selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }

/* ============================= FORMS ============================= */
label{ font-size:12.5px; font-weight:700; color:var(--text-muted); display:block; margin:16px 0 7px; letter-spacing:.02em; }
label:first-child{ margin-top:0; }
input[type=text], input[type=date], input[type=time], input[type=number], input[type=tel], textarea, select{
  width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border-strong);
  background:var(--bg-elevated); font-size:15px; color:var(--text);
}
textarea{ resize:vertical; min-height:80px; line-height:1.45; }
input::placeholder, textarea::placeholder{ color:var(--text-faint); }

/* ============================= EMPTY STATE ============================= */
.empty{ text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty-icon{ font-size:34px; margin-bottom:10px; }
.empty-title{ font-family:var(--font-display); font-size:17px; color:var(--text); margin-bottom:6px; }
.empty-sub{ font-size:13.5px; line-height:1.5; max-width:280px; margin:0 auto 16px; }

/* ============================= BOTTOM NAV / FAB ============================= */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--bg-elevated); border-top:1px solid var(--border);
  padding-bottom:var(--safe-bottom);
}
.bottom-nav-inner{
  max-width:560px; margin:0 auto; display:flex; height:var(--nav-h);
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; cursor:pointer; color:var(--text-faint); font-size:10.5px; font-weight:600;
  min-height:44px;
}
.nav-item svg{ width:21px; height:21px; }
.nav-item.active{ color:var(--accent); }

.fab{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--safe-bottom) - 26px); transform:translateX(-50%);
  width:58px; height:58px; border-radius:50%; background:var(--accent); color:#fff; border:none;
  box-shadow:var(--shadow-l); display:flex; align-items:center; justify-content:center; cursor:pointer;
  z-index:31; transition:transform .15s ease;
}
.fab:active{ transform:translateX(-50%) scale(0.92); }
.fab svg{ width:26px; height:26px; }

/* ============================= SHEET / MODAL ============================= */
.scrim{
  position:fixed; inset:0; background:var(--scrim); z-index:50; opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.scrim.open{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--bg-elevated);
  border-radius:24px 24px 0 0; max-width:560px; margin:0 auto; max-height:88vh; overflow-y:auto;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.3,1);
  box-shadow:var(--shadow-l); padding:10px 20px calc(24px + var(--safe-bottom));
}
.sheet.open{ transform:translateY(0); }
.sheet-handle{ width:38px; height:4px; border-radius:3px; background:var(--border-strong); margin:6px auto 14px; }
.sheet-title{ font-size:19px; margin-bottom:4px; }
.sheet-sub{ font-size:13.5px; color:var(--text-muted); margin-bottom:16px; line-height:1.5; }
.sheet-close{ position:absolute; top:16px; right:16px; }

.dialog-scrim{ position:fixed; inset:0; background:var(--scrim); z-index:60; display:none; align-items:center; justify-content:center; padding:20px;}
.dialog-scrim.open{ display:flex; }
.dialog{ background:var(--surface); border-radius:var(--radius-l); padding:22px; max-width:360px; width:100%; box-shadow:var(--shadow-l); }
.dialog h3{ font-size:17px; margin-bottom:8px; }
.dialog p{ font-size:14px; color:var(--text-muted); line-height:1.5; margin-bottom:18px; }

/* Toast */
#toast{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + 24px + var(--safe-bottom)); transform:translateX(-50%) translateY(10px);
  background:var(--text); color:var(--bg); padding:11px 18px; border-radius:30px; font-size:13.5px; font-weight:600;
  z-index:70; opacity:0; pointer-events:none; transition:all .25s ease; box-shadow:var(--shadow-m); max-width:80%; text-align:center;
}
[data-theme-resolved="dark"] #toast{ background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong); }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* onboarding */
.onboard-wrap{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding:calc(30px + var(--safe-top)) 26px calc(26px + var(--safe-bottom)); }
.onboard-mark{ width:56px; height:56px; border-radius:16px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:28px; margin-bottom:22px; }
.onboard-wrap h1{ font-size:30px; line-height:1.15; margin-bottom:10px; }
.onboard-tagline{ font-size:15px; color:var(--text-muted); margin-bottom:26px; line-height:1.55; }
.progress-dots{ display:flex; gap:6px; margin-bottom:22px; }
.progress-dots span{ width:22px; height:4px; border-radius:3px; background:var(--border-strong); }
.progress-dots span.on{ background:var(--accent); }

.small-link{ font-size:13px; color:var(--text-muted); text-decoration:underline; background:none; border:none; cursor:pointer; padding:8px; }

.avatar{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:17px; flex:0 0 auto; }
.divider{ height:1px; background:var(--border); margin:14px 0; border:none; }

.pill-toggle{ display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:2px; }
.pill-toggle button{ flex:1; border:none; background:none; padding:9px; border-radius:10px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; }
.pill-toggle button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-s); }

.timeline-day{ margin-bottom:6px; }
.timeline-date{ font-size:12px; font-weight:700; color:var(--text-faint); letter-spacing:.06em; text-transform:uppercase; margin:18px 2px 8px; }
.timeline-entry{ display:flex; gap:12px; padding:9px 2px; }
.timeline-time{ font-size:11.5px; color:var(--text-faint); width:56px; flex:0 0 auto; padding-top:2px; }
.timeline-dot-wrap{ display:flex; flex-direction:column; align-items:center; flex:0 0 auto; }
.timeline-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:5px; }
.timeline-line{ flex:1; width:1.5px; background:var(--border); margin-top:4px; }

.profile-tabs{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 14px; -ms-overflow-style:none; scrollbar-width:none; }
.profile-tabs::-webkit-scrollbar{ display:none; }
.profile-tab{ flex:0 0 auto; padding:9px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; }
.profile-tab.active{ background:var(--text); color:var(--bg); border-color:var(--text); }

.hero-card{ background:linear-gradient(160deg, var(--accent-soft), var(--surface)); border:1px solid var(--border); border-radius:var(--radius-l); padding:20px; margin-bottom:16px; }

.swipe-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

.privacy-note{ display:flex; gap:10px; align-items:flex-start; background:var(--accent-soft); border-radius:14px; padding:13px 14px; font-size:12.5px; color:var(--accent-strong); line-height:1.5; margin-bottom:16px;}
.privacy-note svg{ flex:0 0 auto; margin-top:2px; }

.k-v{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; }
.k-v:last-child{ border-bottom:none; }
.k-v .k{ color:var(--text-muted); }
.k-v .v{ font-weight:600; }

.mic-btn{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border-strong); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
.mic-btn.recording{ background:var(--danger); border-color:var(--danger); color:#fff; animation:pulse 1.2s infinite; }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(178,74,52,.4);} 70%{box-shadow:0 0 0 10px rgba(178,74,52,0);} 100%{box-shadow:0 0 0 0 rgba(178,74,52,0);} }

.fade-in{ animation:fadeIn .22s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

.suggest-box{ background:var(--accent-soft); border-radius:14px; padding:13px 14px; margin:14px 0; font-size:13.5px; color:var(--accent-strong); }
.suggest-box strong{ display:block; margin-bottom:8px; font-weight:700; }

@media (min-width:601px){
  #app{ box-shadow:var(--shadow-m); min-height:100vh; }
  body{ background:var(--surface-2); }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" onclick="UI.closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="dialog-scrim" id="dialogScrim"><div class="dialog" id="dialogBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* =========================================================================
   STATE
   ========================================================================= */
const STORAGE_KEY = "remainder_data_v1";
const APP_VERSION = 1;
let memoryFallback = false;
let state = null;
let route = { screen:"home", params:{} };
let searchDebounce = null;
let notifiedThisSession = new Set();
let recognizer = null;
let listeningTarget = null;

function defaultState(){
  return {
    version: APP_VERSION,
    settings:{
      theme:"system",
      buvanName:"Buvan",
      onboarded:false,
      notifAsked:false,
      cycleLength:28,
      pmsOffset:5,
      pmsChecklist:[
        "Check how she's feeling",
        "Ask if she needs anything",
        "Be mindful of discomfort",
        "Remember anything she mentioned before"
      ]
    },
    people:[],
    memories:[],
    reminders:[],
    followUps:[],
    projects:[],
    bucketList:[],
    timeline:[],
    cycles:[],
    healthRecords:[],
    notifications:{ permission:"default" }
  };
}

/* =========================================================================
   STORAGE
   ========================================================================= */
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return migrateData(parsed);
  }catch(e){
    console.warn("Remainder: localStorage unavailable, using in-memory data only.", e);
    memoryFallback = true;
    return defaultState();
  }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    memoryFallback = true;
    console.warn("Remainder: could not persist data.", e);
  }
}
function migrateData(data){
  if(!data || typeof data !== "object") return defaultState();
  if(!data.version) data.version = 1;
  const d = defaultState();
  const merged = Object.assign({}, d, data);
  merged.settings = Object.assign({}, d.settings, data.settings||{});
  ["people","memories","reminders","followUps","projects","bucketList","timeline","cycles","healthRecords"].forEach(k=>{
    if(!Array.isArray(merged[k])) merged[k] = [];
  });
  merged.version = APP_VERSION;
  return merged;
}

/* =========================================================================
   ID GENERATOR
   ========================================================================= */
function uid(prefix){
  const rand = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2,10));
  return (prefix?prefix+"_":"")+rand;
}

/* =========================================================================
   DATE UTILITIES
   ========================================================================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function parseLocal(dateStr){ if(!dateStr) return null; const p=dateStr.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function toISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(dateStr,n){ const d=parseLocal(dateStr); d.setDate(d.getDate()+n); return toISO(d); }
function addWeeks(dateStr,n){ return addDays(dateStr,n*7); }
function addMonths(dateStr,n){ const d=parseLocal(dateStr); d.setMonth(d.getMonth()+n); return toISO(d); }
function daysBetween(a,b){ const A=parseLocal(a), B=parseLocal(b); return Math.round((B-A)/86400000); }
function isPastDateTime(dateStr,timeStr){
  if(!dateStr) return false;
  const now = new Date();
  const d = parseLocal(dateStr);
  if(timeStr){ const [h,m]=timeStr.split(":").map(Number); d.setHours(h,m,0,0); } else { d.setHours(23,59,59,999); }
  return d.getTime() < now.getTime();
}
function formatTime12(t){
  if(!t) return "";
  let [h,m]=t.split(":").map(Number);
  const ap = h>=12?"PM":"AM";
  h = h%12; if(h===0) h=12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;
}
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function humanDate(dateStr,timeStr){
  if(!dateStr) return timeStr ? formatTime12(timeStr) : "";
  const diff = daysBetween(todayStr(), dateStr);
  let label;
  if(diff===0) label="Today";
  else if(diff===1) label="Tomorrow";
  else if(diff===-1) label="Yesterday";
  else if(diff<0) label=Math.abs(diff)+" day"+(Math.abs(diff)===1?"":"s")+" overdue";
  else if(diff>1 && diff<7) label=WEEKDAYS[parseLocal(dateStr).getDay()];
  else { const d=parseLocal(dateStr); label = MONTHS[d.getMonth()]+" "+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?", "+d.getFullYear():""); }
  if(timeStr) label += " · "+formatTime12(timeStr);
  return label;
}
function isOverdue(dateStr,timeStr){ return dateStr && isPastDateTime(dateStr,timeStr); }
function nowTimestamp(){ return new Date().toISOString(); }
function humanTimestamp(iso){
  const d = new Date(iso);
  const ds = toISO(d);
  const diff = daysBetween(ds, todayStr());
  const time = (function(){ let h=d.getHours(); const m=d.getMinutes(); const ap=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12; return h+":"+String(m).padStart(2,"0")+" "+ap; })();
  if(diff===0) return time;
  if(diff===1) return "Yesterday · "+time;
  if(diff<7) return WEEKDAYS[d.getDay()]+" · "+time;
  return MONTHS[d.getMonth()]+" "+d.getDate()+" · "+time;
}
function dayGroupLabel(iso){
  const d = new Date(iso);
  const ds = toISO(d);
  const diff = daysBetween(ds, todayStr());
  if(diff===0) return "Today";
  if(diff===1) return "Yesterday";
  if(diff<7) return WEEKDAYS[d.getDay()];
  return MONTHS[d.getMonth()]+" "+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?", "+d.getFullYear():"");
}

function nextDueDate(r){
  if(r.repeatType==="none") return null;
  const n = r.repeatInterval||1;
  if(r.repeatType==="daily") return addDays(r.dueDate,n);
  if(r.repeatType==="weekly") return addWeeks(r.dueDate,n);
  if(r.repeatType==="monthly") return addMonths(r.dueDate,n);
  if(r.repeatType==="custom-days") return addDays(r.dueDate,n);
  if(r.repeatType==="custom-weeks") return addWeeks(r.dueDate,n);
  if(r.repeatType==="custom-months") return addMonths(r.dueDate,n);
  return null;
}

  const r = state.reminders.find(x=>x.id===id);

  if(nd){

function latestCycle(){ if(!state.cycles.length) return null; return state.cycles[state.cycles.length-1]; }
function periodPredictions(){
  const last = latestCycle();
  if(!last) return null;
  const cycleLength = state.settings.cycleLength||28;
  const pmsOffset = state.settings.pmsOffset||5;
  const nextPeriod = addDays(last.startDate, cycleLength);
  const pmsStart = addDays(nextPeriod, -pmsOffset);
  const currentDay = daysBetween(last.startDate, todayStr())+1;
  const daysRemaining = daysBetween(todayStr(), nextPeriod);
  const inPmsWindow = todayStr()>=pmsStart && todayStr()<nextPeriod;
  return { lastStart:last.startDate, cycleLength, pmsOffset, nextPeriod, pmsStart, currentDay, daysRemaining, inPmsWindow };
}
function maybeCreatePmsTimelineNote(){
  const pred = periodPredictions();
  if(!pred || !pred.inPmsWindow) return;
  const gf = girlfriend();
  if(!gf) return;
  const already = state.reminders.find(r=> r.personId===gf.id && r.title==="PMS window reminder" && r.dueDate===pred.pmsStart);

  addReminder({ title:"PMS window reminder", description: state.settings.pmsChecklist.join(" · "), personId:gf.id, dueDate:pred.pmsStart, priority:"Important", repeatType:"none" });
}

function searchEverything(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  state.people.forEach(p=>{
    const hay = [p.name,p.notes,p.relationship,(p.preferences&&p.preferences.favFood)||"",(p.preferences&&p.preferences.favColor)||""].join(" ").toLowerCase();
    if(hay.includes(q)) results.push({ kind:"Person", personId:p.id, title:p.name, sub:p.relationship||p.area, date:"" });
  });
  state.memories.forEach(m=>{ if(m.text.toLowerCase().includes(q)) results.push({ kind:"Memory", personId:m.personId, title:m.text, sub:personLabel(m.personId), date:humanTimestamp(m.timestamp) }); });
  state.reminders.forEach(r=>{ const hay=(r.title+" "+r.description).toLowerCase(); if(hay.includes(q)) results.push({ kind:"Reminder", personId:r.personId, title:r.title, sub:personLabel(r.personId)+" · "+r.status, date:humanDate(r.dueDate,r.dueTime) }); });
  state.followUps.forEach(f=>{ if(f.text.toLowerCase().includes(q)) results.push({ kind:"Follow-up", personId:f.personId, title:f.text, sub:personLabel(f.personId), date:humanDate(f.dueDate) }); });
  state.projects.forEach(p=>{ const hay=(p.title+" "+p.description+" "+p.notes).toLowerCase(); if(hay.includes(q)) results.push({ kind:"Project", personId:"buvan", title:p.title, sub:p.nextAction||"Buvan project", date:"" }); });
  state.bucketList.forEach(b=>{ const hay=(b.title+" "+b.description+" "+b.notes).toLowerCase(); if(hay.includes(q)) results.push({ kind:"Bucket list", personId:b.personId, title:b.title, sub:b.timeline, date:"" }); });
  state.healthRecords.forEach(h=>{ const hay=(h.issue+" "+h.notes+" "+h.medicineName+" "+h.doctor).toLowerCase(); if(hay.includes(q)) results.push({ kind:"Health", personId:h.personId, title:healthRecordLabel(h), sub:personLabel(h.personId), date:h.dateAdded }); });
  state.timeline.forEach(t=>{ if(t.text.toLowerCase().includes(q)) results.push({ kind:"Timeline", personId:t.personId, title:t.text, sub:personLabel(t.personId), date:humanTimestamp(t.timestamp) }); });
  return results;
}

/* =========================================================================
   CONTEXTUAL SUGGESTION ENGINE
   ========================================================================= */
function analyzeText(text){
  const t = text.toLowerCase();
  const out = { suggestReminder:false, suggestFollowUp:false, suggestedImportance:"Normal", suggestedCategory:"General", suggestedArea:null, matched:[] };
  const has = (words)=> words.some(w=>t.includes(w));
  if(has(["call"])){ out.suggestReminder=true; out.matched.push("call"); }
  if(has(["birthday"])){ out.suggestReminder=true; out.suggestedCategory="Birthday"; out.matched.push("birthday"); }
  if(has(["doctor","medicine","appointment","pain","hurt"])){ out.suggestFollowUp=true; out.suggestedCategory="Health"; out.suggestedImportance="Important"; out.matched.push("health"); }
  if(has(["tomorrow","next week","next month"])){ out.suggestReminder=true; out.matched.push("timing"); }
  if(has(["passport","licence","license","deadline"])){ out.suggestedImportance="Important"; out.suggestedArea="buvan"; out.matched.push("document"); }
  if(has(["she ","her ","girlfriend"])){ out.suggestedArea="girlfriend"; }
  if(has(["mom","dad","mother","father","parents"])){ out.suggestedArea="family"; }
  return out;
}

   ========================================================================= */
function notifSupported(){ return "Notification" in window; }
function requestNotifPermission(){
  if(!notifSupported()){ state.notifications.permission="unsupported"; saveState(); return; }
  Notification.requestPermission().then(p=>{ state.notifications.permission=p; saveState(); });
}
function checkDueReminders(){
  if(!notifSupported() || Notification.permission!=="granted") return;
  const now = new Date();
  activeReminders().forEach(r=>{
    if(!r.dueDate) return;
    if(notifiedThisSession.has(r.id)) return;
    if(isPastDateTime(r.dueDate, r.dueTime) ){
      const dueMoment = parseLocal(r.dueDate);
      if(r.dueTime){ const [h,m]=r.dueTime.split(":").map(Number); dueMoment.setHours(h,m,0,0); }
      if(now - dueMoment < 12*3600*1000){
        try{ new Notification("Remainder: "+r.title, { body:r.description||("For "+personLabel(r.personId)) }); }catch(e){}
        notifiedThisSession.add(r.id);
      }
    }
  });
}

   VOICE INPUT
   ========================================================================= */
function voiceSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function startVoice(targetId){
  if(!voiceSupported()){ showToast("Voice input isn't supported in this browser. You can type instead."); return; }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognizer = new Rec();
  recognizer.lang = "en-US"; recognizer.interimResults=false; recognizer.maxAlternatives=1;
  listeningTarget = targetId;
  const btn = document.getElementById("micBtn");
  if(btn) btn.classList.add("recording");
  recognizer.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    const el = document.getElementById(targetId);
    if(el){ el.value = (el.value ? el.value+" " : "")+text; el.dispatchEvent(new Event("input")); }
  };
  recognizer.onend = ()=>{ if(btn) btn.classList.remove("recording"); };
  recognizer.onerror = ()=>{ if(btn) btn.classList.remove("recording"); showToast("Couldn't catch that — try typing instead."); };
  try{ recognizer.start(); }catch(e){}
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "remainder-backup-"+todayStr()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Backup exported");
}
function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ showToast("That file isn't valid backup data."); return; }
    if(!parsed || typeof parsed!=="object" || !("people" in parsed)){ showToast("That file doesn't look like a Remainder backup."); return; }
    UI.confirmDialog({
      title:"Replace current data?",
      body:"This backup will replace the current local data. This can't be undone.",
      confirmLabel:"Replace data", danger:true,
      onConfirm:()=>{ state = migrateData(parsed); saveState(); UI.render(); showToast("Backup restored"); }
    });
  };
  reader.readAsText(file);
}

  UI.confirmDialog({
    title:"Reset all data?",

/* =========================================================================
   RENDER: HOME
   ========================================================================= */
function computeHomeItems(){
  const overdue = [];
  const today = [];
  const upcoming = [];
  activeReminders().forEach(r=>{
    if(!r.dueDate) return;
    const entry = { type:"reminder", id:r.id, title:r.title, personId:r.personId, dueDate:r.dueDate, dueTime:r.dueTime, priority:r.priority };
    if(isOverdue(r.dueDate,r.dueTime)) overdue.push(entry);
    else if(r.dueDate===todayStr()) today.push(entry);
    else if(daysBetween(todayStr(),r.dueDate)<=7) upcoming.push(entry);
  });
  activeFollowUps().forEach(f=>{
    const entry = { type:"followup", id:f.id, title:f.text, personId:f.personId, dueDate:f.dueDate, dueTime:f.dueTime, priority:"Normal" };
    if(f.dueDate && isOverdue(f.dueDate,null)) overdue.push(entry);
    else if(!f.dueDate || f.dueDate===todayStr()) today.push(entry);
    else if(daysBetween(todayStr(),f.dueDate)<=7) upcoming.push(entry);
  });
  const order = { Critical:0, Important:1, Normal:2, Low:3 };
  const sorter = (a,b)=> (order[a.priority]??2)-(order[b.priority]??2);
  overdue.sort(sorter); today.sort(sorter); upcoming.sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
  return { overdue, today, upcoming };
}

function itemRow(entry){
  const isDone = false;
  return `
  <div class="list-item" onclick="ItemActions.open('${entry.type}','${entry.id}')">
    <div class="check-circle" onclick="event.stopPropagation(); ItemActions.quickComplete('${entry.type}','${entry.id}')">${icon('check')}</div>
    <div style="flex:1; min-width:0;">
      <div class="row-between">
        <div class="item-title">${esc(entry.title)}</div>
        ${priorityBadge(entry.priority)}
      </div>
      <div class="item-sub">${esc(personLabel(entry.personId)||'General')}${entry.dueDate?' · '+humanDate(entry.dueDate,entry.dueTime):''}</div>
    </div>
  </div>`;
}

function renderHome(){
  const { overdue, today, upcoming } = computeHomeItems();
  const hour = new Date().getHours();
  const greet = hour<5?"Still up":hour<12?"Good morning":hour<17?"Good afternoon":hour<21?"Good evening":"Good night";
  const total = overdue.length+today.length;
  let summary;
  if(total===0 && upcoming.length===0) summary = "Nothing needs your attention right now.";
  else {
    const parts = [];
    if(total>0) parts.push(total+" thing"+(total===1?"":"s")+" need"+(total===1?"s":"")+" your attention");
    if(overdue.length>0) parts.push(overdue.length+" follow-up"+(overdue.length===1?" is":"s are")+" overdue");
    if(upcoming.length>0) parts.push(upcoming.length+" important thing"+(upcoming.length===1?" is":"s are")+" coming up");
    summary = parts.join(". ")+".";
  }

  let html = `
    <div class="hero-card">
      <div style="font-size:13px; color:var(--text-muted); font-weight:600; margin-bottom:4px;">${greet}, ${esc(state.settings.buvanName)}</div>
      <div style="font-family:var(--font-display); font-size:19px; line-height:1.4;">${esc(summary)}</div>
    </div>
  `;

  if(overdue.length===0 && today.length===0 && upcoming.length===0){
    html += emptyState("🌤️","Nothing on your plate","Capture a memory, a reminder, or a follow-up with the button below — Remainder will help you keep track.");
  }

  if(overdue.length){
    html += `<div class="section-title">Overdue</div><div class="card">${overdue.map(itemRow).join("")}</div>`;
  }
  if(today.length){
    html += `<div class="section-title">Today</div><div class="card">${today.map(itemRow).join("")}</div>`;
  }
  if(upcoming.length){
    html += `<div class="section-title">Upcoming</div><div class="card">${upcoming.map(itemRow).join("")}</div>`;
  }
  return html;
}

   ========================================================================= */
function summarizeArea(area){
  if(area==="buvan"){
    const projects = state.projects.filter(p=>p.status==="active").length;
    const bl = bucketFor("buvan").length;
    return projects+" active project"+(projects===1?"":"s")+" · "+bl+" bucket-list item"+(bl===1?"":"s");
  }
  if(area==="girlfriend"){
    const gf = girlfriend();
    if(!gf) return "Not set up yet";
    const fu = activeFollowUps().filter(f=>f.personId===gf.id).length;
    const rem = activeReminders().filter(r=>r.personId===gf.id).length;
    const mem = memoriesForPerson(gf.id).length;
    return fu+" follow-up"+(fu===1?"":"s")+" · "+rem+" reminder"+(rem===1?"":"s")+" · "+mem+" memor"+(mem===1?"y":"ies");
  }
  if(area==="family"){
    const members = peopleByArea("family");
    const rem = activeReminders().filter(r=>members.some(m=>m.id===r.personId)).length;
    return members.length+" member"+(members.length===1?"":"s")+" · "+rem+" reminder"+(rem===1?"":"s");
  }
  if(area==="friend"){
    const fr = peopleByArea("friend");
    const soonBday = fr.filter(f=>f.birthday && daysBetween(todayStr(), nextBirthday(f.birthday))<=30).length;
    return fr.length+" friend"+(fr.length===1?"":"s")+" · "+soonBday+" birthday"+(soonBday===1?"":"s")+" coming up";
  }
  return "";
}
function nextBirthday(bday){
  if(!bday) return null;
  const d = parseLocal(bday);
  const y = new Date().getFullYear();
  let next = new Date(y, d.getMonth(), d.getDate());
  if(next < new Date(new Date().toDateString())) next = new Date(y+1, d.getMonth(), d.getDate());
  return toISO(next);
}

function groupedTimeline(entries){
  const groups = [];
  entries.forEach(e=>{
    const label = dayGroupLabel(e.timestamp);
    let g = groups.find(x=>x.label===label);
    if(!g){ g={label,items:[]}; groups.push(g); }
    g.items.push(e);
  });
  return groups.map(g=>`
    <div class="timeline-day">
      <div class="timeline-date">${g.label}</div>
      ${g.items.map(e=>`
        <div class="timeline-entry">
          <div class="timeline-time">${humanTimestamp(e.timestamp).split('·').pop().trim()}</div>
          <div style="flex:1;">
            <div class="item-title" style="font-size:14px; font-weight:500;">${esc(e.text)}</div>

    </div>`).join("");
}

   PERIOD TRACKER SCREEN
   ========================================================================= */
function renderPeriodTracker(){
  const gf = girlfriend();
  const pred = periodPredictions();
  let html = `<div class="privacy-note">${icon('shield')} Predictions are estimates based on the dates you enter and are not medical advice.</div>`;
  if(!gf){
    html += emptyState("💚","Add a girlfriend profile first","Period tracking connects to that profile.");
    return html;
  }
  if(pred){
    html += `<div class="card">
      <div class="k-v"><div class="k">Last period</div><div class="v">${humanDate(pred.lastStart)}</div></div>
      <div class="k-v"><div class="k">Cycle day</div><div class="v">Day ${pred.currentDay}</div></div>
      <div class="k-v"><div class="k">Predicted next period</div><div class="v">${humanDate(pred.nextPeriod)}</div></div>
      <div class="k-v"><div class="k">Days remaining</div><div class="v">${pred.daysRemaining}</div></div>
      <div class="k-v"><div class="k">Predicted PMS start</div><div class="v">${humanDate(pred.pmsStart)}</div></div>
    </div>`;
    if(pred.inPmsWindow){
      html += `<div class="suggest-box"><strong>PMS window may have started</strong>${state.settings.pmsChecklist.map(c=>'• '+esc(c)).join('<br>')}</div>`;
    }
  } else {
    html += emptyState("🗓️","No cycles logged yet","Add the start date of the last cycle to begin predicting.");
  }
  html += `<button class="btn btn-secondary btn-block" onclick="PeriodUI.addCycle()">+ Log period start date</button>`;
  html += `<div class="section-title">Settings</div><div class="card">
    <label>Cycle length (days)</label>
    <input type="number" min="15" max="60" value="${state.settings.cycleLength}" onchange="PeriodUI.setCycleLength(this.value)">
    <label>PMS starts (days before period)</label>
    <input type="number" min="0" max="20" value="${state.settings.pmsOffset}" onchange="PeriodUI.setPmsOffset(this.value)">
  </div>`;
  if(state.cycles.length){
    html += `<div class="section-title">History</div><div class="card">`+state.cycles.slice().reverse().map(c=>`
      <div class="k-v"><div class="k">${humanDate(c.startDate)}</div><div class="v"><button class="btn btn-ghost btn-sm" onclick="PeriodUI.deleteCycle('${c.id}')">Remove</button></div></div>`).join("")+`</div>`;
  }
  return html;
}

};

const Capture = {
  state:{ type:null, text:"", personId:"", category:"General", importance:"Normal" },
  open(){
    Capture.state = { type:null, text:"", personId:"", category:"General", importance:"Normal" };
    UI.openSheet(`
      <div class="sheet-handle"></div>
      <div class="sheet-title">Quick capture</div>
      <div class="sheet-sub">What would you like to remember?</div>
      <div class="chip-row">
        ${[["memory","Memory"],["reminder","Reminder"],["followup","Follow-up"],["person","Person update"],["task","Task / Project"]].map(([k,l])=>`<button class="chip" onclick="Capture.chooseType('${k}')">${l}</button>`).join("")}
      </div>
    `);
  },
  chooseType(type){
    Capture.state.type = type;
    const placeholder = type==="memory" ? '"She said her stomach hurts."' : type==="reminder" ? '"Call Mom tomorrow at 7 PM."' : type==="followup" ? '"Check passport application."' : type==="task" ? '"Book passport appointment."' : '"Loves filter coffee."';
    UI.openSheet(`
      <div class="sheet-handle"></div>
      <div class="sheet-title">${captureTitle(type)}</div>
      <div class="row" style="align-items:flex-start; gap:10px;">
        <textarea id="captureText" placeholder='${placeholder}' style="flex:1;" oninput="Capture.onTextInput(this.value)"></textarea>
        <button class="mic-btn" id="micBtn" onclick="startVoice('captureText')" aria-label="Voice input">${icon('mic')}</button>
      </div>
      <div id="suggestArea"></div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="Capture.proceed()">Continue</button>
    `);
  },
  onTextInput(v){
    Capture.state.text = v;
    const s = analyzeText(v);
    const box = document.getElementById("suggestArea");
    if(!box) return;
    if(!v.trim() || (!s.suggestReminder && !s.suggestFollowUp && s.matched.length===0)){ box.innerHTML=""; return; }
    const chips = [];
    if(s.suggestReminder) chips.push("Create a reminder?");
    if(s.suggestFollowUp) chips.push("Worth a follow-up?");
    if(s.suggestedImportance!=="Normal") chips.push("Mark as "+s.suggestedImportance+"?");
    box.innerHTML = `<div class="suggest-box"><strong>This sounds like it needs attention</strong>${chips.join(" · ")}</div>`;
  },
  proceed(){
    const text = document.getElementById("captureText").value.trim();
    if(!text){ showToast("Type or say something first"); return; }
    Capture.state.text = text;
    const type = Capture.state.type;
    if(type==="memory") return Capture.memoryStep2();
    if(type==="reminder") return Capture.reminderStep2();
    if(type==="followup") return Capture.followupStep2();
    if(type==="person") return Capture.personUpdateStep2();
    if(type==="task") return Capture.taskStep2();
  },
  personChips(selected){
    const opts = [["buvan",state.settings.buvanName]];
    const gf = girlfriend(); if(gf) opts.push([gf.id,gf.name]);
    peopleByArea("family").forEach(p=>opts.push([p.id,p.name]));
    peopleByArea("friend").forEach(p=>opts.push([p.id,p.name]));
    return `<div class="chip-row" id="capPersonChips">${opts.map(([id,name])=>`<button type="button" class="chip ${selected===id?'selected':''}" data-val="${id}" onclick="ReminderUI.selectChip('capPersonChips',this)">${esc(name)}</button>`).join("")}</div>`;
  },
  memoryStep2(){
    const s = analyzeText(Capture.state.text);
    let suggestedPerson = "buvan";
    if(s.suggestedArea==="girlfriend" && girlfriend()) suggestedPerson = girlfriend().id;
    UI.openSheet(`
      <div class="sheet-handle"></div>
      <div class="sheet-title">Who is this about?</div>
      ${Capture.personChips(suggestedPerson)}
      <label>Category</label>
      <div class="chip-row" id="capCategory">${["General","Health","Preference","Plan","Event"].map(c=>`<button type="button" class="chip ${c===s.suggestedCategory?'selected':''}" data-val="${c}" onclick="ReminderUI.selectChip('capCategory',this)">${c}</button>`).join("")}</div>
      <label>Importance</label>
      <div class="chip-row" id="capImportance">${["Normal","Important","Critical"].map(c=>`<button type="button" class="chip ${c===s.suggestedImportance?'selected':''}" data-val="${c}" onclick="ReminderUI.selectChip('capImportance',this)">${c}</button>`).join("")}</div>

    `);
  },

    const personId = document.querySelector("#capPersonChips .chip.selected")?.dataset.val || "buvan";

      <div class="sheet-handle"></div>
      <div class="sheet-title">Would you like to follow up?</div>

      ${Capture.personChips(suggestedPerson)}

    `);
  },
  saveReminder(){

      dueDate:document.getElementById("capDate").value, dueTime:document.getElementById("capTime").value,

      <label>Relationship</label><input type="text" id="obFamRel" placeholder="e.g. Mother">
      <div style="flex:1;"></div>
      <button class="btn btn-primary btn-block" onclick="Onboard.saveFamily()">Save and continue</button>
      <button class="small-link" onclick="Onboard.next()">Skip</button>
    `;
  } else {
    body = `
      <div class="onboard-mark">✓</div>
      <h1 style="font-size:26px;">You're all set.</h1>
      <div class="onboard-tagline">Remainder will help you remember the people, moments, and responsibilities that matter — and bring the right thing back to you at the right time.</div>
      <div style="flex:1;"></div>
      <button class="btn btn-primary btn-block" onclick="Onboard.finish()">Enter Remainder</button>
    `;
  }
  return `<div class="onboard-wrap">
    <div class="progress-dots">${dots}</div>
    ${body}
    ${key!=="welcome"&&key!=="done"?`<button class="small-link" style="align-self:center;" onclick="Onboard.skipAll()">Skip setup</button>`:''}
  </div>`;
}
function attachOnboardingHandlers(){}
const Onboard = {
  next(){ onboardStep++; UI.render(); },
  setTheme(t){ state.settings.theme=t; saveState(); resolveTheme(); UI.render(); },
  enableNotif(){ requestNotifPermission(); setTimeout(Onboard.next,200); },
  saveGirlfriend(){
    const name = document.getElementById("obGfName").value.trim();
    if(name) addPerson({ area:"girlfriend", name, relationship:"Girlfriend", preferences:{likes:[],dislikes:[],favFood:"",favColor:"",placesToVisit:[],thingsToBuy:[],importantDates:[]} });
    Onboard.next();
  },
  saveFamily(){
    const name = document.getElementById("obFamName").value.trim();
    if(name) addPerson({ area:"family", name, relationship:document.getElementById("obFamRel").value.trim() });
    Onboard.next();
  },
  skipAll(){ Onboard.finish(); },
  finish(){ state.settings.onboarded = true; saveState(); UI.render(); }
};

/* =========================================================================
   NAVIGATION helper exposure + generic handlers
   ========================================================================= */
function attachScreenHandlers(){ /* rendering is fully declarative via inline handlers */ }

   INITIALIZATION
   ========================================================================= */
window.setTheme = setTheme;
window.requestNotifPermission = requestNotifPermission;
window.startVoice = startVoice;
window.UI = UI;
window.ItemActions = ItemActions;
window.ReminderUI = ReminderUI;
window.FollowUpUI = FollowUpUI;
window.BucketUI = BucketUI;
window.ProjectUI = ProjectUI;
window.HealthUI = HealthUI;
window.People = People;
window.Capture = Capture;
window.Onboard = Onboard;
window.MoreUI = MoreUI;
window.SearchUI = SearchUI;
window.PeriodUI = PeriodUI;
window.addDays = addDays;

function init(){
  state = loadState();
  if(state.cycles && state.cycles.length) maybeCreatePmsTimelineNote();
  resolveTheme();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if(state.settings.theme==="system"){ resolveTheme(); } });
  UI.render();
  setInterval(checkDueReminders, 60000);
  checkDueReminders();
}
document.addEventListener("DOMContentLoaded", init);
})();
